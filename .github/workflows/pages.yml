name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Steps from other repositories are pinned to a commit, not a tag, because a tag can be moved to different code.
# The comment after each commit says which release it is; to update one, look up that release's commit.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the shop's maths and the dev server's guards
        run: npm test
      - name: Collect the files the site serves
        run: |
          mkdir _site
          cp -r index.html 404.html manifest.webmanifest sw.js robots.txt sitemap.xml css js assets _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
